# fly.toml app configuration file generated for depinonbnb on 2026-05-16T19:01:54+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'depinonbnb'
primary_region = 'lhr'

[build]

[env]
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'info'
  PORT = '3000'

[[mounts]]
  source = 'depin_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
